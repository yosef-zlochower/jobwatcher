# JobWatcher cluster defaults for green-prairies (Slurm 23.11, node-exclusive partitions).
# Sourced first; ~/.JobWatcher/config overrides; `jw setup` options override that.
# All values are plain bash assignments.

CLUSTER=gp
MASTERNODE=green-prairies          # used only as an ssh fallback if a compute node cannot run sbatch/mail

PARTITION=gp-default               # gp-default: 2 day limit; gp-long: 20 days
WALLTIME=24:00:00                  # Slurm format: [D-]HH:MM:SS
NODES=2
CORES_PER_NODE=32                  # 2 sockets x 16 cores, no hyperthreading
TASKS_PER_NODE=8                   # MPI ranks per node
CPUS_PER_TASK=4                    # OpenMP threads per rank (TASKS_PER_NODE * CPUS_PER_TASK should equal CORES_PER_NODE)
MEM=""                             # --mem per node, e.g. 16G. Empty = Slurm default (whole node on the exclusive gp/wl
                                   # partitions; 2 GB per CPU on the shared debug/lm-largemem partition, so set it there)

SETUP_SCRIPT=/lustre/yosef/NewCluster/Kruskal/Cactus/build_files/setup_intel21.sh   # sourced inside the job (modules/spack)
LAUNCHER="srun --mpi=pmix"         # how to start the executable; followed by ./EXE PARFILE
OMP_PROC_BIND=close
OMP_PLACES=cores
EXTRA_ENV=""                       # extra shell lines evaluated inside the job before launching, e.g. 'export I_MPI_DEBUG=2'
SBATCH_EXTRA=""                    # extra lines inserted verbatim into the batch script header, e.g. '#SBATCH --exclusive'

MAIL=$USER                         # ~/.forward decides where it goes
SLURM_MAIL_TYPE=FAIL               # Slurm's own notifications (sent by the controller, always works)
MAIL_EVENTS="fail,complete"        # JobWatcher's own summary mails: any of start,success,fail,complete,stopped

MAX_RUNS=100                       # hard cap on Run directories per simulation
QUEUE_DEPTH=1                      # successors to keep queued ahead of the running job
MIN_PROGRESS=100                   # a run must advance at least this many iterations to count as success
RUNTIME_MARGIN_MIN=20              # cactus::max_runtime = walltime - this (minutes): time for the termination checkpoint and hooks
STRICT_CHECKPOINT=no               # yes: refuse to start if the newest checkpoint is not the predecessor's termination checkpoint
POST_RUN_HOOK=""                   # script run in-job after SUCCESS/COMPLETE: <hook> <rundir> <state>; see hooks/
HOOK_FAILURE_FATAL=no

# Environment handed to the batch jobs.  --export=NONE makes Slurm give every job a fresh login
# environment (the same whether it was submitted from the login node or from the predecessor job);
# the job then runs ENV_INIT, sources SETUP_SCRIPT and evaluates EXTRA_ENV.  /etc/profile.d/lmod.sh
# is a no-op inside Slurm jobs, so ENV_INIT defines `module` when the login environment lacked it.
SBATCH_EXPORT=NONE
ENV_INIT='type module >/dev/null 2>&1 || { export MODULEPATH=${MODULEPATH:-/opt/ohpc/pub/modulefiles}; . /opt/ohpc/admin/lmod/lmod/init/bash; }'
