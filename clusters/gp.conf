# JobWatcher cluster defaults for green-prairies (Slurm 23.11, node-exclusive partitions).
# Sourced first; the user config (~/.config/jobwatcher/config, jw configure) overrides; `jw setup` options override that.
# All values are plain bash assignments.

CLUSTER=gp
SCHEDULER=slurm                    # backend lib/sched/<name>.sh and template templates/<name>/sub.template
MASTERNODE=green-prairies          # used only as an ssh fallback if a compute node cannot run sbatch/mail

PARTITION=gp-default               # gp-default: 2 day limit; gp-long: 20 days
# The partitions (sinfo -o '%P %c %m %l'), one per line: name, cores per node, node memory,
# the MEM to request by default ('-' = none: whole node on the node-exclusive partitions), walltime limit.
# jw setup takes CORES_PER_NODE and the default MEM from the chosen partition's line.
PARTITIONS="
# name         cores  node_mem  default_mem  max_walltime
gp-default     32     192G      -            2-00:00:00
gp-long        32     192G      -            20-00:00:00
wl-default     32     192G      -            2-00:00:00
wl-long        32     192G      -            20-00:00:00
all-default    32     192G      -            -
debug          48     770G      390G         12:00:00      # shared node: Slurm gives 2 GB per CPU unless MEM is set
lm-largemem    48     770G      390G         1-00:00:00    # shared node, see debug
"
WALLTIME=24:00:00                  # Slurm format: [D-]HH:MM:SS
NODES=2
CORES_PER_NODE=32                  # for partitions not in the table (gp/wl nodes: 2 sockets x 16 cores, no hyperthreading)
TASKS_PER_NODE=8                   # MPI ranks per node
CPUS_PER_TASK=4                    # OpenMP threads per rank (TASKS_PER_NODE * CPUS_PER_TASK should equal the partition's cores)
MEM=""                             # --mem per node, e.g. 16G. Empty = the partition's default_mem, else Slurm's default
ACCOUNT=""                         # --account: green-prairies has no allocations
QOS=""                             # --qos: not used on green-prairies
EXCLUSIVE=no                       # yes adds --exclusive (the gp partitions are node-exclusive anyway)

SETUP_SCRIPT=""                    # script sourced inside every job to set up modules/spack. Personal, so set it with
                                   # 'jw configure --setup-script FILE' (goes to ~/.config/jobwatcher/config), not here
LAUNCHER="srun --mpi=pmix"         # how to start the executable; followed by ./EXE PARFILE
OMP_PROC_BIND=close
OMP_PLACES=cores
EXTRA_ENV=""                       # extra shell lines evaluated inside the job before launching, e.g. 'export I_MPI_DEBUG=2'
HEADER_EXTRA=""                    # extra lines inserted verbatim into the batch script header, e.g. '#SBATCH --gres=gpu:1'

MAIL=$USER                         # ~/.forward decides where it goes
MAIL_TYPE=FAIL                     # Slurm's own notifications (--mail-type; sent by the controller, always works)
MAIL_EVENTS="fail,complete"        # JobWatcher's own summary mails: any of start,success,fail,complete,stopped

MAX_RUNS=100                       # hard cap on Run directories per simulation
QUEUE_DEPTH=1                      # successors to keep queued ahead of the running job
MIN_PROGRESS=100                   # a run must advance at least this many iterations to count as success
RUNTIME_MARGIN_MIN=20              # cactus::max_runtime = walltime - this (minutes): time for the termination checkpoint and hooks
STRICT_CHECKPOINT=no               # yes: refuse to start if the newest checkpoint is not the predecessor's termination checkpoint
POST_RUN_HOOK=""                   # script run in-job after SUCCESS/COMPLETE as <hook> <rundir> <state>; see README
HOOK_FAILURE_FATAL=no

# Environment handed to the batch jobs.  --export=NONE makes Slurm give every job a fresh login
# environment (the same whether it was submitted from the login node or from the predecessor job);
# the job then runs ENV_INIT, sources SETUP_SCRIPT and evaluates EXTRA_ENV.  /etc/profile.d/lmod.sh
# is a no-op inside Slurm jobs, so ENV_INIT defines `module` when the login environment lacked it.
SBATCH_EXPORT=NONE
ENV_INIT='type module >/dev/null 2>&1 || { export MODULEPATH=${MODULEPATH:-/opt/ohpc/pub/modulefiles}; . /opt/ohpc/admin/lmod/lmod/init/bash; }'
