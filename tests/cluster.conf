# JobWatcher cluster config used by tests/run_tests.sh (a minimal, cluster-neutral example).
CLUSTER=test
SCHEDULER=slurm
MASTERNODE=""
PARTITION=test
PARTITIONS="
# name  cores  tasks  cpus  node_mem  default_mem  max_walltime
test    4      2      2     8G        -            1:00:00
big     8      2      2     64G       16G          2:00:00      # shared node: default layout uses half of it
"
WALLTIME=1:00:00
NODES=1
SETUP_SCRIPT=""
LAUNCHER="srun"
SBATCH_EXPORT=NONE
ENV_INIT=""
